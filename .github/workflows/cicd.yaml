name: CI-CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:

  # ============================================================
  # 1. TEST
  # ============================================================
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install flake8 pytest pytest-cov

      - name: Run linting
        run: |
          flake8 app/ \
            --max-line-length=120 \
            --exclude=app/tests/

      - name: Run tests
        run: |
          pytest app/tests/ \
            -v \
            --cov=app \
            --cov-report=term-missing


  # ============================================================
  # 2. BUILD DOCKER IMAGE
  # ============================================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          load: true
          tags: |
            abdulbhashiths/ipl-voter:${{ github.sha }}

      - name: Save Docker image
        run: |
          docker save \
            abdulbhashiths/ipl-voter:${{ github.sha }} \
            -o ipl-voter-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipl-voter-image-${{ github.sha }}
          path: ipl-voter-image.tar
          retention-days: 1


  # ============================================================
  # 3. TRIVY SECURITY SCAN
  # ============================================================
  security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: ipl-voter-image-${{ github.sha }}

      - name: Load Docker image
        run: |
          docker load \
            -i ipl-voter-image.tar

      - name: Verify Docker image
        run: |
          docker images

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: abdulbhashiths/ipl-voter:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0


  # ============================================================
  # 4. HUMAN APPROVAL + DOCKER HUB PUSH
  # ============================================================
  docker-push:
    name: Human Approval and Docker Push
    runs-on: ubuntu-latest
    needs: security-scan

    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: ipl-voter-image-${{ github.sha }}

      - name: Load Docker image
        run: |
          docker load \
            -i ipl-voter-image.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker image
        run: |
          docker tag \
            abdulbhashiths/ipl-voter:${{ github.sha }} \
            abdulbhashiths/ipl-voter:latest

      - name: Push Docker image
        run: |
          docker push abdulbhashiths/ipl-voter:${{ github.sha }}
          docker push abdulbhashiths/ipl-voter:latest


  # ============================================================
  # 5. HELM VALIDATION
  # ============================================================
  helm-validate:
    name: Helm Validation
    runs-on: ubuntu-latest
    needs: docker-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Helm lint
        run: |
          helm lint k8/helm/ipl-voter/

      - name: Helm template validation
        run: |
          helm template \
            ipl-voter \
            k8/helm/ipl-voter/ \
            > /dev/null


  # ============================================================
  # 6. UPDATE HELM IMAGE TAG
  # ============================================================
  update-image-tag:
    name: Update Helm Image Tag
    runs-on: ubuntu-latest
    needs: helm-validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update image tag in values.yaml
        run: |
          sed -i \
            's/^  tag: .*/  tag: "${{ github.sha }}"/' \
            k8/helm/ipl-voter/values.yaml

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet k8/helm/ipl-voter/values.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated values.yaml
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8/helm/ipl-voter/values.yaml

          git commit \
            -m "chore(cd): update image tag to ${{ github.sha }}"

          git push origin HEAD:main


  # ============================================================
  # 7. EMAIL NOTIFICATION
  # ============================================================
  notify:
    name: Pipeline Notification
    runs-on: ubuntu-latest

    needs:
      - test
      - docker-build
      - security-scan
      - docker-push
      - helm-validate
      - update-image-tag

    if: always()

    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          to: ${{ secrets.EMAIL_USERNAME }}
          from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>

          subject: >-
            ${{ contains(needs.*.result, 'failure')
            && '❌ FAILED'
            || '✅ SUCCESS' }}
            - IPL Voter Pipeline #${{ github.run_number }}

          body: |
            IPL Voter CI/CD Pipeline

            Pipeline Status:
            ${{ contains(needs.*.result, 'failure') && 'FAILED ❌' || 'SUCCESS ✅' }}

            Commit:
            ${{ github.sha }}

            Branch:
            ${{ github.ref_name }}

            Author:
            ${{ github.actor }}

            Job Results:

            Test:
            ${{ needs.test.result }}

            Docker Build:
            ${{ needs.docker-build.result }}

            Trivy Security Scan:
            ${{ needs.security-scan.result }}

            Docker Push:
            ${{ needs.docker-push.result }}

            Helm Validation:
            ${{ needs.helm-validate.result }}

            Update Helm Image Tag:
            ${{ needs.update-image-tag.result }}

            View Run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
