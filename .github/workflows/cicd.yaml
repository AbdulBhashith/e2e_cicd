name: CI-CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  # ============================================================
  # 1. TEST
  # ============================================================
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install flake8 pytest pytest-cov

      - name: Run linting
        run: |
          flake8 app/ \
            --max-line-length=120 \
            --exclude=app/tests/

      - name: Run tests
        run: |
          pytest app/tests/ \
            -v \
            --cov=app \
            --cov-report=term-missing


  # ============================================================
  # 2. BUILD + TRIVY + MANUAL APPROVAL + PUSH
  # ============================================================
  docker:
    name: Build, Scan, Approve and Push
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # DOCKER BUILD
      # ----------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          load: true
          tags: |
            abdulbhashiths/ipl-voter:${{ github.sha }}


      # ----------------------------------------------------------
      # TRIVY SECURITY SCAN
      # ----------------------------------------------------------
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: abdulbhashiths/ipl-voter:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0


      # ----------------------------------------------------------
      # MANUAL APPROVAL
      # ----------------------------------------------------------
      - name: Manual approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: AbdulBhashith
          minimum-approvals: 1
          issue-title: "Docker Image Approval - IPL Voter"
          issue-body: |
            Docker image has been successfully built and scanned.

            Image:
            abdulbhashiths/ipl-voter:${{ github.sha }}

            Trivy scan completed.

            Please review the workflow logs and approve this issue
            if the image should be pushed to Docker Hub.

          exclude-workflow-initiator-as-approver: false


      # ----------------------------------------------------------
      # DOCKER HUB LOGIN
      # ----------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # ----------------------------------------------------------
      # TAG IMAGE
      # ----------------------------------------------------------
      - name: Tag Docker image
        run: |
          docker tag \
            abdulbhashiths/ipl-voter:${{ github.sha }} \
            abdulbhashiths/ipl-voter:latest


      # ----------------------------------------------------------
      # PUSH IMAGE
      # ----------------------------------------------------------
      - name: Push Docker image
        run: |
          docker push \
            abdulbhashiths/ipl-voter:${{ github.sha }}

          docker push \
            abdulbhashiths/ipl-voter:latest


  # ============================================================
  # 3. HELM VALIDATION
  # ============================================================
  helm-validate:
    name: Helm Validation
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Helm lint
        run: |
          helm lint k8/helm/ipl-voter/

      - name: Helm template validation
        run: |
          helm template \
            ipl-voter \
            k8/helm/ipl-voter/ \
            > /dev/null


  # ============================================================
  # 4. UPDATE HELM IMAGE TAG
  # ============================================================
  update-image-tag:
    name: Update Helm Image Tag
    runs-on: ubuntu-latest
    needs: helm-validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update image tag
        run: |
          sed -i \
            's/^  tag: .*/  tag: "${{ github.sha }}"/' \
            k8/helm/ipl-voter/values.yaml

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet k8/helm/ipl-voter/values.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8/helm/ipl-voter/values.yaml

          git commit \
            -m "chore(cd): update image tag to ${{ github.sha }}"

          git push origin HEAD:main
